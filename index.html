<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8dfca">
  <title></title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/hoof.svg">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js" defer></script>
  <script src="js/state.js" defer></script>
  <script src="js/meme.js" defer></script>
  <script src="js/noButton.js" defer></script>
  <script src="js/share.js" defer></script>
  <script src="js/easterEggs.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <header class="masthead"><span data-copy="department"></span><span data-copy="fileNumber"></span></header>
  <main class="dossier">
    <div class="file-tab" data-copy="documentNumber"></div>
    <div class="document-top"><span data-copy="issue"></span><span data-copy="classification"></span></div>
    <nav id="progress" hidden></nav>
    <section id="INTRO"></section>
    <section id="LOADING" hidden></section>
    <section id="DATE_SELECT" hidden></section>
    <section id="HORSE_SELECT" hidden></section>
    <section id="FOOD_SELECT" hidden></section>
    <section id="SUMMARY" hidden></section>
    <section id="DECLINE_RESULT" hidden></section>
    <section id="APPROVAL_SEQUENCE" hidden></section>
    <section id="FINAL_APPROVED" hidden></section>
    <div class="document-bottom"><span data-copy="documentNumber"></span><span class="barcode" aria-hidden="true"></span></div>
  </main>
  <footer><p id="system-status" aria-hidden="true"></p><p data-copy="footer"></p></footer>
  <div id="toast" role="status" hidden></div>
  <aside id="manual-copy" hidden></aside>
  <div id="egg" hidden></div>
</body>
</html>
